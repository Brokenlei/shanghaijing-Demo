<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>山海经地图</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Noto+Sans+SC:wght@300;400;500;700&family=Ma+Shan+Zheng&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Noto Sans SC', sans-serif;
            background: transparent;
            overflow: hidden;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
        }
        html, body { width: 100%; height: 100%; }

        .map-container {
            position: relative;
            width: 100%;
            height: 100%;
            min-height: 400px;
            overflow: hidden;
            cursor: grab;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
            background: #f5f0e6;
        }
        .map-container:active { cursor: grabbing; }
        .map-container.dragging { cursor: grabbing; }

        #map-content-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 1280px;
            height: 720px;
            transform-origin: 0 0;
            will-change: transform;
        }

        .game-map-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            pointer-events: none;
        }

        .regions-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: auto;
        }
        .region-path {
            fill: rgba(0, 0, 0, 0.01);
            stroke: none;
            pointer-events: auto;
            cursor: pointer;
        }
        .region-path.locked {
            stroke: none;
            cursor: not-allowed;
        }
        .region-path.active {
            stroke: none;
        }

        .region-label {
            position: absolute;
            font-family: 'Ma Shan Zheng', 'STXingkai', 'STKaiti', 'KaiTi', 'FangSong', serif;
            font-size: 32px;
            font-weight: bold;
            color: #1a1a1a;
            text-shadow: 1px 1px 2px rgba(255, 255, 255, 0.9), -1px -1px 2px rgba(255, 255, 255, 0.9), 1px -1px 2px rgba(255, 255, 255, 0.9), -1px 1px 2px rgba(255, 255, 255, 0.9);
            pointer-events: auto;
            cursor: pointer;
            white-space: nowrap;
            z-index: 50;
            letter-spacing: 5px;
        }
        .region-label.active {
            color: #c73e1d;
            text-shadow: 1px 1px 2px rgba(255, 255, 255, 0.9), 0 0 10px rgba(199, 62, 29, 0.6);
        }

        /* 上北下南左西右东 */
        .beishan-label { top: 18%; left: 50%; transform: translateX(-50%); }
        .nanshan-label { bottom: 18%; left: 50%; transform: translateX(-50%); }
        .xishan-label { top: 50%; left: 8%; transform: translateY(-50%); }
        .dongshan-label { top: 50%; right: 20%; transform: translateY(-50%); }
        .zhongshan-label { top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 42px; }
        /* 海内在右下角 */
        .hainei-label { bottom: 25%; right: 22%; }
        /* 海外在右上角 */
        .haiwai-label { top: 28%; right: 24%; }
        /* 大荒在最右上侧 */
        .dahuang-label { top: 3%; right: 2%; font-size: 36px; z-index: 100; }

        .current-marker {
            position: absolute;
            z-index: 200;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }
        .marker-dot {
            width: 14px;
            height: 14px;
            background: radial-gradient(circle, #ff6b4a 0%, #c73e1d 70%, transparent 100%);
            border-radius: 50%;
            border: 2px solid white;
            box-shadow: 0 0 12px rgba(199, 62, 29, 0.9), 0 2px 6px rgba(0, 0, 0, 0.4);
            z-index: 2;
        }
        .marker-pulse {
            position: absolute;
            width: 32px;
            height: 32px;
            border: 2px solid rgba(199, 62, 29, 0.6);
            border-radius: 50%;
            animation: markerPulse 2s ease-out infinite;
        }
        .marker-pulse.delay { animation-delay: 1s; }
        @keyframes markerPulse {
            0% { transform: scale(0.3); opacity: 1; }
            100% { transform: scale(2.5); opacity: 0; }
        }
    </style>
</head>
<body>

                <path class="region-path" data-region="nanshan" d="M24,66 L28,64 L32,67 L36,63 L40,66 L44,62 L48,65 L52,61 L56,64 L60,60 L64,63 L68,60 L72,63 L76,60 L72,70 L68,74 L64,72 L60,76 L56,74 L52,78 L48,76 L44,78 L40,76 L36,78 L32,75 L28,77 L24,74 L22,70 Z" />

                <!-- 东山经 -->
                <path class="region-path" data-region="dongshan" d="M82,30 L78,28 L74,32 L72,36 L74,42 L72,48 L74,54 L72,60 L74,66 L78,68 L82,66 L84,62 L86,56 L84,50 L86,44 L84,38 L86,34 Z" />
                <!-- 中山经 -->
                <path class="region-path" data-region="zhongshan" d="M42,36 L48,32 L54,34 L60,32 L64,38 L66,44 L64,52 L66,58 L62,64 L56,66 L50,68 L44,66 L38,64 L34,58 L36,50 L34,44 L38,38 Z" />
            </svg>

            <!-- 区域标签 -->
            <div class="region-label dahuang-label" data-region="dahuang">大荒经</div>
            <div class="region-label haiwai-label" data-region="haiwai">海外经</div>
            <div class="region-label hainei-label" data-region="hainei">海内经</div>
            <div class="region-label beishan-label" data-region="beishan">北山经</div>
            <div class="region-label nanshan-label" data-region="nanshan">南山经</div>
            <div class="region-label xishan-label" data-region="xishan">西山经</div>
            <div class="region-label dongshan-label" data-region="dongshan">东山经</div>
            <div class="region-label zhongshan-label" data-region="zhongshan">中山经</div>

            <div id="map-marker-current" class="current-marker">
                <div class="marker-pulse"></div>
                <div class="marker-pulse delay"></div>
                <div class="marker-dot"></div>
            </div>
        </div>
    </div>

    <script>
        const mapState = {
            x: 0,
            y: 0,
            scale: 1,
            isDragging: false,
            startX: 0,
            startY: 0,
            minScale: 0.2,
            maxScale: 3,
            fitScale: 1
        };

        const regionMarkerPos = {
            // 上北下南左西右东
            beishan: { x: 50, y: 22 },
            nanshan: { x: 50, y: 78 },
            xishan: { x: 12, y: 50 },
            dongshan: { x: 72, y: 50 },
            zhongshan: { x: 42, y: 50 },
            // 海内在右下角
            hainei: { x: 72, y: 72 },
            // 海外在右上角
            haiwai: { x: 72, y: 28 },
            // 大荒在最外层（环绕整个地图）
            dahuang: { x: 3, y: 50 }
        };

        let currentRegion = 'nanshan';
        let unlockedRegions = ['nanshan'];

        const container = document.getElementById('map-container');
        const wrapper = document.getElementById('map-content-wrapper');
        const regionsSvg = document.getElementById('regions-svg');

        function calcFitScale() {
            const containerRect = container.getBoundingClientRect();
            const contentW = wrapper.offsetWidth;
            const contentH = wrapper.offsetHeight;
            if (contentW === 0 || contentH === 0) return 1;
            const scaleX = containerRect.width / contentW;
            const scaleY = containerRect.height / contentH;
            return Math.max(scaleX, scaleY);
        }

        function clampPosition() {
            const containerRect = container.getBoundingClientRect();
            const cw = containerRect.width;
            const ch = containerRect.height;
            const contentW = wrapper.offsetWidth;
            const contentH = wrapper.offsetHeight;
            const scale = mapState.scale;
            const scaledW = contentW * scale;
            const scaledH = contentH * scale;

            if (scaledW <= cw) {
                mapState.x = (cw - scaledW) / 2;
            } else {
                const maxX = 0;
                const minX = cw - scaledW;
                mapState.x = Math.max(minX, Math.min(maxX, mapState.x));
            }

            if (scaledH <= ch) {
                mapState.y = (ch - scaledH) / 2;
            } else {
                const maxY = 0;
                const minY = ch - scaledH;
                mapState.y = Math.max(minY, Math.min(maxY, mapState.y));
            }
        }

        function applyTransform() {
            wrapper.style.transform = `translate(${mapState.x}px, ${mapState.y}px) scale(${mapState.scale})`;
        }

        function updateTransform() {
            clampPosition();
            applyTransform();
        }

        function zoomAt(mouseX, mouseY, delta) {
            const prevScale = mapState.scale;
            let newScale = mapState.scale * delta;
            // 缩小时不能小于 fitScale（铺满div的大小）
            if (delta < 1 && newScale < mapState.fitScale) {
                newScale = mapState.fitScale;
            }
            mapState.scale = Math.min(mapState.maxScale, newScale);
            const ratio = mapState.scale / prevScale;
            mapState.x = mouseX - ratio * (mouseX - mapState.x);
            mapState.y = mouseY - ratio * (mouseY - mapState.y);
            updateTransform();
        }

        function panToRegion(regionId) {
            const pos = regionMarkerPos[regionId];
            if (!pos) return;
            const contentW = wrapper.offsetWidth;
            const contentH = wrapper.offsetHeight;
            const targetX = (pos.x / 100) * contentW;
            const targetY = (pos.y / 100) * contentH;
            const containerRect = container.getBoundingClientRect();
            mapState.scale = Math.min(Math.max(1.5, mapState.fitScale), mapState.maxScale);
            const scaledTargetX = targetX * mapState.scale;
            const scaledTargetY = targetY * mapState.scale;
            mapState.x = containerRect.width / 2 - scaledTargetX;
            mapState.y = containerRect.height / 2 - scaledTargetY;
            updateTransform();
        }

        function updateMarker(regionId) {
            const pos = regionMarkerPos[regionId];
            const marker = document.getElementById('map-marker-current');
            if (pos && marker) {
                marker.style.left = pos.x + '%';
                marker.style.top = pos.y + '%';
                marker.style.transform = 'translate(-50%, -50%)';
            }
        }

        function updateRegions() {
            const paths = regionsSvg.querySelectorAll('.region-path');
            const labels = document.querySelectorAll('.region-label');
            paths.forEach(path => {
                const regionId = path.getAttribute('data-region');
                if (!unlockedRegions.includes(regionId)) {
                    path.classList.add('locked');
                } else {
                    path.classList.remove('locked');
                }
                if (regionId === currentRegion) {
                    path.classList.add('active');
                } else {
                    path.classList.remove('active');
                }
            });
            labels.forEach(label => {
                const regionId = label.getAttribute('data-region');
                if (regionId) {
                    if (!unlockedRegions.includes(regionId)) {
                        label.classList.add('locked');
                    } else {
                        label.classList.remove('locked');
                    }
                    if (regionId === currentRegion) {
                        label.classList.add('active');
                    } else {
                        label.classList.remove('active');
                    }
                }
            });
        }

        function clickRegion(regionId) {
            if (window.parent !== window) {
                window.parent.postMessage({ type: 'regionClick', regionId: regionId }, '*');
            }
        }

        let dragMoved = false;
        let dragStartX = 0, dragStartY = 0;
        let clickedRegionId = null;

        function getRegionFromEvent(e) {
            const target = e.target;
            if (target.classList.contains('region-path')) {
                return target.getAttribute('data-region');
            }
            const label = target.closest('.region-label');
            if (label) {
                return label.getAttribute('data-region');
            }
            return null;
        }

        function initInteraction() {

            container.addEventListener('wheel', (e) => {
                e.preventDefault();
                const rect = container.getBoundingClientRect();
                const mouseX = e.clientX - rect.left;
                const mouseY = e.clientY - rect.top;
                const delta = e.deltaY > 0 ? 0.9 : 1.1;
                zoomAt(mouseX, mouseY, delta);
            }, { passive: false });

            container.addEventListener('mousedown', (e) => {
                clickedRegionId = getRegionFromEvent(e);
                mapState.isDragging = true;
                mapState.startX = e.clientX - mapState.x;
                mapState.startY = e.clientY - mapState.y;
                dragMoved = false;
                dragStartX = e.clientX;
                dragStartY = e.clientY;
                container.classList.add('dragging');
            });

            document.addEventListener('mousemove', (e) => {
                if (!mapState.isDragging) return;
                const dx = e.clientX - dragStartX;
                const dy = e.clientY - dragStartY;
                if (Math.abs(dx) > 5 || Math.abs(dy) > 5) {
                    dragMoved = true;
                }
                if (dragMoved) {
                    mapState.x = e.clientX - mapState.startX;
                    mapState.y = e.clientY - mapState.startY;
                    updateTransform();
                }
            });

            document.addEventListener('mouseup', () => {
                if (mapState.isDragging && !dragMoved && clickedRegionId) {
                    clickRegion(clickedRegionId);
                }
                mapState.isDragging = false;
                clickedRegionId = null;
                container.classList.remove('dragging');
            });

            let lastTouchDist = 0;
            let touchStartRegionId = null;
            container.addEventListener('touchstart', (e) => {
                if (e.touches.length === 2) {
                    e.preventDefault();
                    const dx = e.touches[0].clientX - e.touches[1].clientX;
                    const dy = e.touches[0].clientY - e.touches[1].clientY;
                    lastTouchDist = Math.sqrt(dx * dx + dy * dy);
                } else if (e.touches.length === 1) {
                    const touch = e.touches[0];
                    const el = document.elementFromPoint(touch.clientX, touch.clientY);
                    touchStartRegionId = null;
                    if (el) {
                        if (el.classList.contains('region-path')) {
                            touchStartRegionId = el.getAttribute('data-region');
                        } else {
                            const label = el.closest('.region-label');
                            if (label) {
                                touchStartRegionId = label.getAttribute('data-region');
                            }
                        }
                    }
                    mapState.isDragging = true;
                    mapState.startX = touch.clientX - mapState.x;
                    mapState.startY = touch.clientY - mapState.y;
                    dragMoved = false;
                    dragStartX = touch.clientX;
                    dragStartY = touch.clientY;
                    container.classList.add('dragging');
                }
            }, { passive: false });

            container.addEventListener('touchmove', (e) => {
                e.preventDefault();
                if (e.touches.length === 2) {
                    const dx = e.touches[0].clientX - e.touches[1].clientX;
                    const dy = e.touches[0].clientY - e.touches[1].clientY;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (lastTouchDist > 0) {
                        const ratio = dist / lastTouchDist;
                        const rect = container.getBoundingClientRect();
                        const cx = (e.touches[0].clientX + e.touches[1].clientX) / 2 - rect.left;
                        const cy = (e.touches[0].clientY + e.touches[1].clientY) / 2 - rect.top;
                        zoomAt(cx, cy, ratio);
                    }
                    lastTouchDist = dist;
                } else if (e.touches.length === 1 && mapState.isDragging) {
                    const touch = e.touches[0];
                    const dx = touch.clientX - dragStartX;
                    const dy = touch.clientY - dragStartY;
                    if (Math.abs(dx) > 5 || Math.abs(dy) > 5) {
                        dragMoved = true;
                    }
                    if (dragMoved) {
                        mapState.x = touch.clientX - mapState.startX;
                        mapState.y = touch.clientY - mapState.startY;
                        updateTransform();
                    }
                }
            }, { passive: false });

            container.addEventListener('touchend', () => {
                if (mapState.isDragging && !dragMoved && touchStartRegionId) {
                    clickRegion(touchStartRegionId);
                }
                mapState.isDragging = false;
                lastTouchDist = 0;
                touchStartRegionId = null;
                container.classList.remove('dragging');
            });

            window.addEventListener('resize', () => {
                mapState.fitScale = calcFitScale();
                if (mapState.scale < mapState.fitScale) {
                    mapState.scale = mapState.fitScale;
                    mapState.x = 0;
                    mapState.y = 0;
                    updateTransform();
                } else {
                    updateTransform();
                }
            });
        }

        window.addEventListener('message', (event) => {
            const data = event.data;
            if (!data || !data.type) return;

            switch (data.type) {
                case 'setRegion':
                    currentRegion = data.regionId;
                    updateMarker(currentRegion);
                    updateRegions();
                    break;
                case 'setUnlocked':
                    unlockedRegions = data.regions || [];
                    updateRegions();
                    break;
                case 'panToRegion':
                    panToRegion(data.regionId);
                    break;
            }
        });

        function init() {
            mapState.fitScale = calcFitScale();
            mapState.scale = mapState.fitScale;
            mapState.x = 0;
            mapState.y = 0;
            updateMarker(currentRegion);
            updateRegions();
            initInteraction();
            updateTransform();

            setTimeout(() => {
                mapState.fitScale = calcFitScale();
                mapState.scale = mapState.fitScale;
                mapState.x = 0;
                mapState.y = 0;
                updateTransform();
            }, 200);
        }

        window.addEventListener('resize', () => {
            mapState.fitScale = calcFitScale();
            updateTransform();
        });

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    </script>
</body>
</html>
